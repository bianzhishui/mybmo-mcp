# 业务容器。只跑 mcp 一个服务；网络、Casdoor、PostgreSQL、Caddy 都在 pandabase-infra。
#
# 前置：共享网络已存在（infra 仓库的 scripts/bootstrap-network.sh），否则 up 会报 network not found。
#
#   cd deploy && cp .env.example .env && vim .env
#   docker compose up -d --build
#   docker compose logs -f mcp

name: mybmo

services:
  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # 国内服务器在 .env 里设 PYPI_INDEX 指向镜像；不设则用官方 PyPI
        PYPI_INDEX: ${PYPI_INDEX:-https://pypi.org/simple}
    image: mybmo-mcp:0.1.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 覆盖 .env 里的相对路径，指到卷上
      MYBMO_DATA_DIR: /data
    volumes:
      - data:/data
    ports:
      # 只绑回环：宿主 Caddy 能打到，公网打不到
      - "127.0.0.1:8000:8000"
    networks:
      - pandabase

volumes:
  data:
    # 显式钉死卷名：改 project 名时不会静默换成一个空卷
    name: mybmo_data

networks:
  pandabase:
    external: true
