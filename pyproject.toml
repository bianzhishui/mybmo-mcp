[project]
name = "mybmo-mcp"
version = "0.3.1"
description = "百度营销开放平台的 MCP 能力网关：全量接口 + 多账户"
readme = "README.md"
authors = [
    { name = "bianzhishui", email = "v_dchaobian@tencent.com" }
]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "baidu", "sem", "marketing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=43",
    "httpx2>=2.16.0,<3",
    "mcp[cli]>=2.3.0,<3",
    "pydantic-settings>=2.16,<3",
    # JWT 校验是 Resource Server 的运行时能力（auth/resource.py），不是可选项
    "pyjwt[crypto]>=2.15,<3",
    "starlette>=0.40",
    "typer>=0.28,<1",
]

[project.optional-dependencies]
# 多租户落库时才需要。当前授权表还是文件式（data/tenancy.json）。
# 启用时在 Dockerfile 的两条 uv sync 后追加 --extra db。
db = [
    "psycopg[binary,pool]>=3.3,<4",
]

[project.scripts]
mybmo-mcp = "mybmo_mcp.server:main"

[build-system]
requires = ["uv_build>=0.9.20,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "baiduads-sdk>=2023.1.0",
    "pytest>=8",
    "pytest-asyncio>=1.4",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF"]
# RUF001/002/003 把中文全角标点判为“易混淆字符”。本项目注释与文档以中文为主，关闭这三条。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "live: 需要真实百度账户，CI 默认跳过",
    "pg: 需要真实 PostgreSQL 实例",
]
