# 业务容器。只跑 mcp 一个服务；网络、Casdoor、PostgreSQL、Caddy 都在 pandabase-infra。
#
# 前置：共享网络已存在（infra 仓库的 scripts/bootstrap-network.sh），否则 up 会报 network not found。
#
#   cd deploy && cp .env.example .env && vim .env
#   docker compose up -d --build
#   docker compose logs -f mcp

name: mybmo

services:
  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # 国内服务器在 .env 里设 PYPI_INDEX 指向镜像；不设则用官方 PyPI
        PYPI_INDEX: ${PYPI_INDEX:-https://pypi.org/simple}
        # uv.lock 里的绝对下载地址也改写到镜像（不设则不动）
        PYPI_FILES_MIRROR: ${PYPI_FILES_MIRROR:-}
    image: mybmo-mcp:0.3.0
    environment:
      # 日志与 CLI 输出按本地时区显示；数据库侧另有 ALTER DATABASE SET timezone
      TZ: Asia/Shanghai
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # 只绑回环：宿主 Caddy 能打到，公网打不到
      - "127.0.0.1:8000:8000"
    networks:
      - pandabase


networks:
  pandabase:
    external: true
